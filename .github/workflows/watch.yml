name: watch-lotso

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | test-notify"
        default: "run"

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('requirements.txt') }}
      - name: Install
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          WATCH_CONFIG: ${{ secrets.WATCH_CONFIG }}
        run: |
          case "${{ github.event.inputs.mode || 'run' }}" in
            dry-run)     xvfb-run -a python check.py --dry-run ;;
            test-notify) python check.py --test-notify ;;
            *)           xvfb-run -a python check.py ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name "lotso-watch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -qm "state: $(date -u +%FT%H:%MZ)" && git push -q)
